<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#176b58" />
    <title>拾光 · 单机小游戏</title>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <header>
      <a href="/">拾光</a><span>一小会儿，收集一点光。</span><strong>单机游戏</strong>
    </header>
    <main>
      <div class="heading">
        <div>
          <p class="eyebrow">只需要你和一点好奇心</p>
          <h1>把散落的光，收集起来。</h1>
        </div>
        <div class="score"><span>已收集</span><strong id="score">0 / 5</strong></div>
      </div>
      <section class="playfield" aria-label="拾光游戏">
        <canvas
          id="canvas"
          tabindex="0"
          aria-label="游戏画布：使用方向键或 WASD 移动，点击画面指定目的地"
        ></canvas>
        <p id="result" role="status" hidden>全部收集完成，再来一次吧。</p>
      </section>
      <div class="controls">
        <p id="status" role="status">方向键 / WASD 移动，也可以点击画面前往。</p>
        <div><button id="pause">暂停</button><button id="restart">重新开始</button></div>
      </div>
    </main>
    <footer>随时停下来，随时继续。</footer>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
